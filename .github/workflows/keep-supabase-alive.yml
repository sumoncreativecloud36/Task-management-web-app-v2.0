# Keeps the free-tier Supabase project from being paused.
#
# Supabase pauses free projects after 7 days without activity. This workflow
# runs once a day and makes one tiny read against the database through the
# REST API, which counts as activity. Row-level security means the anonymous
# request just gets back an empty list — no user data is read.
#
# Optional: add repository secrets SUPABASE_URL and SUPABASE_ANON_KEY
# (Settings → Secrets and variables → Actions) to point at another project.
# Without them it uses the same public URL/publishable key the app ships with
# in src/lib/backends/config.ts.

name: Keep Supabase alive

on:
  schedule:
    - cron: '17 3 * * *' # every day at 03:17 UTC
  workflow_dispatch: # allows a manual run from the Actions tab

permissions:
  actions: write # lets the last step keep this schedule from being auto-disabled
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://xbtgmhnqsjnogaxhwoog.supabase.co' }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'sb_publishable_ds7Y-OH7OGIgk02uAsnzCQ_Oi4-rlSl' }}
    steps:
      - name: Query the database
        run: |
          status=$(curl -sS -o response.txt -w '%{http_code}' \
            --retry 3 --retry-delay 10 \
            "$SUPABASE_URL/rest/v1/main_categories?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "HTTP $status"
          cat response.txt; echo
          # Fail loudly (GitHub emails you) if the project is already paused or broken.
          test "$status" = "200"

      # GitHub turns off scheduled workflows after 60 days with no commits.
      # Re-enabling it through the API resets that timer.
      - name: Keep this schedule enabled
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/keep-supabase-alive.yml/enable"
